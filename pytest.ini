[pytest]
testpaths = tests
# Don't write .pytest_cache (OneDrive-synced folders often deny access to it)
addopts = -p no:cacheprovider
filterwarnings =
    # Third-party notices that come from the libraries themselves, not from Triavia
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
