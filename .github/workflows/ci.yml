name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Train model (quick)
        run: python model/train.py --quick
      - name: Tests
        run: pytest tests -v --tb=short

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triavia
          POSTGRES_PASSWORD: triavia
          POSTGRES_DB: triavia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triavia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://triavia:triavia@localhost:5432/triavia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python model/train.py --quick
      - name: Tests against PostgreSQL
        run: pytest tests -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: [test, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t triavia-api .
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t triavia-ui .
      - name: Smoke-test the API container
        run: |
          docker run -d --name api -p 8000:8000 -e SECRET_KEY=ci-secret-ci-secret-ci-secret-1234 triavia-api
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health && break || sleep 2; done
          curl -sf localhost:8000/api/v1/health | grep '"is_model_loaded":true'
